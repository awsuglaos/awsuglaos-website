name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    # Scoped to this job deliberately. At workflow level these also reached the
    # deploy job, where a localhost DATABASE_URL made `sst shell -- db:migrate`
    # try to migrate a database that does not exist on the runner, and
    # DEV_AUTH=true had no business being anywhere near a deployed stage.
    env:
      # Matches docker-compose.yml, but on port 5432 — a CI runner has no
      # competing local Postgres to dodge.
      DATABASE_URL: postgresql://awsug:awsug_local_dev@localhost:5432/awsug_lao
      DEV_AUTH: 'true'
      PUBLIC_SITE_URL: http://localhost:4173
      PUBLIC_API_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awsug
          POSTGRES_PASSWORD: awsug_local_dev
          POSTGRES_DB: awsug_lao
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U awsug -d awsug_lao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @awsug/web exec playwright install --with-deps chromium

      - name: Start API
        run: pnpm --filter @awsug/api run dev &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: End-to-end tests
        run: pnpm --filter @awsug/web run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # OIDC: GitHub mints a short-lived token and assumes an AWS role. No
    # long-lived access keys are stored as repository secrets.
    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the deploy role ARN
        # A malformed ARN makes configure-aws-credentials retry for two minutes
        # and then say only "Request ARN is invalid", which does not say why.
        # Fail here instead, naming the actual problem.
        #
        # The value is never printed. GitHub would mask it anyway, but the
        # checks below deliberately report only facts *derived* from it.
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ENV_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is empty. Set it as a secret on the '$ENV_NAME' environment (Settings -> Environments -> $ENV_NAME), or at repository level."
            exit 1
          fi

          # A trailing newline survives a copy-paste into the secret box and is
          # invisible everywhere until STS rejects it.
          if [ "$(printf '%s' "$ROLE_ARN" | tr -d '[:space:]' | wc -c)" -ne "$(printf '%s' "$ROLE_ARN" | wc -c)" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN contains whitespace, most likely a trailing newline from pasting. Re-enter it as a single line with no trailing break."
            exit 1
          fi

          case "$ROLE_ARN" in
            arn:*) ;;
            *)
              echo "::error::AWS_DEPLOY_ROLE_ARN does not start with 'arn:'. It looks like a bare role name. Use the full ARN: arn:aws:iam::<account-id>:role/<role-name>."
              exit 1
              ;;
          esac

          # ARN fields are colon-separated: arn:partition:service:region:account:resource
          RESOURCE_TYPE=$(printf '%s' "$ROLE_ARN" | cut -d: -f6 | cut -d/ -f1)
          if [ "$RESOURCE_TYPE" != "role" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN points at a '$RESOURCE_TYPE', not a role. The most common mix-up is the OIDC identity provider ARN (arn:aws:iam::<account>:oidc-provider/token.actions.githubusercontent.com). You need the IAM *role* ARN instead: IAM -> Roles -> your deploy role -> copy the ARN at the top."
            exit 1
          fi

          if ! printf '%s' "$ROLE_ARN" | grep -qE '^arn:aws:iam::[0-9]{12}:role/.+$'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not a well-formed IAM role ARN. Expected arn:aws:iam::<12-digit account id>:role/<role-name> - check the account id is exactly 12 digits and nothing was truncated."
            exit 1
          fi

          echo "Deploy role ARN is well-formed."

      - name: Show the OIDC subject claim
        # The one fact that settles every trust-policy argument: the `sub` this
        # run actually presents. AWS matches the role's trust policy against
        # this exact string, so printing it turns "Not authorized" from a
        # guessing game into a diff.
        #
        # Repositories created after 2026-07-15 use GitHub's immutable subject
        # format, which appends numeric org and repo IDs
        # (repo:org@123/repo@456:...) rather than the older bare names. A trust
        # policy written in the old format silently matches nothing.
        #
        # The token itself is a short-lived credential and is never printed —
        # only the `sub` and `aud` claims, which are identifiers.
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac
          printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq -r '"sub: \(.sub)\naud: \(.aud)"' \
            || echo "could not decode the OIDC token payload"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Deploy
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SES_FROM_ADDRESS: ${{ vars.SES_FROM_ADDRESS }}
        run: |
          STAGE=${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
          pnpm sst deploy --stage "$STAGE"

      - name: Apply database migrations
        # `sst shell` re-evaluates sst.config.ts to work out what to inject, and
        # the config branches on SITE_DOMAIN. Without the same env block as the
        # deploy step it resolves a *different* shape of the app and hands the
        # migration the wrong resource names.
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SES_FROM_ADDRESS: ${{ vars.SES_FROM_ADDRESS }}
        run: |
          STAGE=${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
          # `sst shell` injects the linked resource environment (cluster ARN,
          # secret ARN, database name), so drizzle-kit talks to Aurora over the
          # Data API with no credentials written to disk.
          pnpm sst shell --stage "$STAGE" -- pnpm db:migrate

      - name: Smoke test
        # A deploy that reports success can still serve a 500 — a missing
        # environment variable only fails on the first render, long after
        # CloudFront says it is ready. Fail the run here rather than finding out
        # from a visitor.
        #
        # The URL is derived rather than read back from the CLI: there is no
        # `sst outputs` command, and an earlier version of this step silently
        # failed because of it. This mirrors the host rule in sst.config.ts —
        # production takes the apex, every other stage takes <stage>.<domain>.
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          STAGE=${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}

          if [ -z "$SITE_DOMAIN" ]; then
            echo "SITE_DOMAIN is unset, so this stage runs on a generated CloudFront URL."
            echo "Nothing to smoke test against; skipping."
            exit 0
          fi

          if [ "$STAGE" = "production" ]; then
            URL="https://$SITE_DOMAIN"
          else
            URL="https://$STAGE.$SITE_DOMAIN"
          fi
          echo "Site: $URL"

          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            [ "$STATUS" = "200" ] && echo "OK" && exit 0
            echo "attempt $i: HTTP $STATUS"
            sleep 15
          done
          echo "::error::$URL did not return 200 after the deploy" >&2
          exit 1
